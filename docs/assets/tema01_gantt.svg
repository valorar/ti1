<path d="M260 78 V389"/><path d="M310 78 V389"/><path d="M360 78 V389"/><path d="M410 78 V389"/><path d="M460 78 V389"/><path d="M510 78 V389"/>
<path d="M560 78 V389"/><path d="M610 78 V389"/><path d="M660 78 V389"/><path d="M710 78 V389"/><path d="M760 78 V389"/><path d="M810 78 V389"/><path d="M860 78 V389"/>
</g>

