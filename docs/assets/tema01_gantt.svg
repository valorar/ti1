<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t1g_title t1g_desc">
<title id="t1g_title">Diagrama de Gantt del proyecto de riego automatizado</title>
<desc id="t1g_desc">Ocho tareas repartidas en doce semanas. Las barras oscuras forman el camino crítico: análisis, búsqueda de información, requisitos, circuito y programa, fabricación, pruebas y documentación. El diseño CAD del soporte es una tarea con holgura. Dos hitos marcan la aprobación de los requisitos al final de la semana cuatro y la entrega al final de la semana doce.</desc>
<defs>
  <marker id="t1g_arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#1a6b7a"/></marker>
</defs>
<rect width="900" height="430" rx="24" fill="#f7faf8"/>
<text x="20" y="32" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#18384a">Diagrama de Gantt del proyecto KR-1 · 12 semanas</text>

<g font-family="system-ui,sans-serif" font-size="11" fill="#58707a" text-anchor="middle">
<text x="285" y="70">S1</text><text x="335" y="70">S2</text><text x="385" y="70">S3</text><text x="435" y="70">S4</text>
<text x="485" y="70">S5</text><text x="535" y="70">S6</text><text x="585" y="70">S7</text><text x="635" y="70">S8</text>
<text x="685" y="70">S9</text><text x="735" y="70">S10</text><text x="785" y="70">S11</text><text x="835" y="70">S12</text>
</g>
