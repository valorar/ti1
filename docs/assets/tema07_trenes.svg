<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t7t_title t7t_desc">
<title id="t7t_title">Tren de engranajes compuesto de dos etapas</title>
<desc id="t7t_desc">Primera etapa: un piñón de veinte dientes engrana con una rueda de sesenta, con relación tres. La rueda de sesenta comparte eje con un piñón de quince dientes, que engrana con una rueda de cuarenta y cinco en la segunda etapa, con relación tres también. La relación total es el producto, nueve: mil ochocientas revoluciones por minuto de entrada se convierten en doscientas de salida, y el par se multiplica por nueve descontando el rendimiento.</desc>
<defs><marker id="t7t_a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#1a6b7a"/></marker></defs>
<rect width="900" height="400" rx="24" fill="#f7faf8"/>
<text x="20" y="32" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#18384a">Tren de engranajes compuesto</text>

<path d="M232 120 V300" stroke="#46616a" stroke-width="5"/>
<text x="244" y="222" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#46616a">mismo eje</text>

<circle cx="232" cy="120" r="84" fill="#e7f3f6" stroke="#0b6680" stroke-width="3"/>
<circle cx="120" cy="120" r="28" fill="#dff3ef" stroke="#2b8c7f" stroke-width="3"/>
<circle cx="316" cy="300" r="63" fill="#e9f5ee" stroke="#167e78" stroke-width="3"/>
<circle cx="232" cy="300" r="21" fill="#fff4d9" stroke="#c6922d" stroke-width="3"/>
<g fill="#46616a"><circle cx="120" cy="120" r="4"/><circle cx="232" cy="120" r="4"/><circle cx="316" cy="300" r="4"/></g>

<g font-family="system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="middle">
<text x="120" y="76" fill="#245c49">Z₁ = 20</text>
<text x="232" y="92" fill="#164d5f">Z₂ = 60</text>
<text x="232" y="348" fill="#705015">Z₃ = 15</text>
<text x="330" y="286" fill="#245c49">Z₄ = 45</text>
</g>
<text x="120" y="180" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#46616a">motor</text>
<text x="316" y="382" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#46616a">salida</text>
<text x="60" y="120" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#0b6680">etapa 1</text>
<text x="140" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#0b6680">etapa 2</text>

<path d="M420 60 V360" stroke="#d8e0df" stroke-width="2"/>
<g font-family="system-ui,sans-serif" fill="#17262d">
<text x="450" y="98" font-size="15" font-weight="700" fill="#18384a">Relación de transmisión</text>
<text x="450" y="132" font-size="15">etapa 1:  i₁ = Z₂ / Z₁ = 60 / 20 = 3</text>
<text x="450" y="162" font-size="15">etapa 2:  i₂ = Z₄ / Z₃ = 45 / 15 = 3</text>
<text x="450" y="196" font-size="16" font-weight="700" fill="#0b6680">total:  i = i₁ · i₂ = 9</text>
<text x="450" y="238" font-size="14" fill="#46616a">Si el motor gira a 1800 min⁻¹:</text>
<text x="450" y="264" font-size="15" font-weight="700" fill="#245c49">n salida = 1800 / 9 = 200 min⁻¹</text>
<text x="450" y="300" font-size="14" fill="#46616a">y el par se multiplica por 9,</text>
<text x="450" y="322" font-size="14" fill="#46616a">descontando el rendimiento.</text>
<text x="450" y="356" font-size="13" font-weight="700" fill="#8f3a24">En un tren compuesto las relaciones se multiplican.</text>
</g>
</svg>
