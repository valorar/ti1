<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t21_title t21_desc">
<title id="t21_title">Cuadro de distribución de una vivienda</title>
<desc id="t21_desc">La acometida entra en el interruptor general automático de 25 amperios, que protege la instalación completa. Después pasa por el interruptor diferencial de 30 miliamperios, que protege a las personas frente a contactos. De la barra común salen cinco circuitos independientes, cada uno con su magnetotérmico dimensionado para proteger la sección de su cable: alumbrado 10 amperios con 1,5 milímetros cuadrados, tomas generales 16 amperios con 2,5, cocina y horno 25 amperios con 6, lavadora y lavavajillas 20 amperios con 4, y aire acondicionado 25 amperios con 6. La toma de tierra conecta las masas metálicas.</desc>
<defs><marker id="t21_a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#17262d"/></marker></defs>
<rect width="900" height="400" rx="24" fill="#f7faf8"/>
<text x="20" y="32" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#18384a">El cuadro de distribución: tres protecciones distintas</text>

<path d="M450 50 V68" stroke="#17262d" stroke-width="3" marker-end="url(#t21_a)"/>
<text x="462" y="62" font-family="system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#46616a">acometida</text>
<rect x="390" y="70" width="120" height="40" rx="6" fill="#fff0ec" stroke="#c85c40" stroke-width="3"/>
<text x="450" y="95" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#8f3a24">IGA · 25 A</text>
<path d="M450 110 V126" stroke="#17262d" stroke-width="3"/>
<rect x="380" y="128" width="140" height="42" rx="6" fill="#fff4d9" stroke="#c6922d" stroke-width="3"/>
<text x="450" y="147" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#705015">Diferencial</text>
<text x="450" y="163" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#705015">30 mA</text>
<path d="M450 170 V206" stroke="#17262d" stroke-width="3"/>
<path d="M120 206 H780" stroke="#17262d" stroke-width="4"/>

<g stroke-width="2.5" fill="#e7f3f6" stroke="#0b6680">
<rect x="120" y="224" width="90" height="42" rx="6"/><rect x="270" y="224" width="90" height="42" rx="6"/><rect x="410" y="224" width="90" height="42" rx="6"/><rect x="555" y="224" width="90" height="42" rx="6"/><rect x="695" y="224" width="90" height="42" rx="6"/>
</g>
<g stroke="#17262d" stroke-width="3">
<path d="M165 206 V224"/><path d="M315 206 V224"/><path d="M455 206 V224"/><path d="M600 206 V224"/><path d="M740 206 V224"/>
</g>
<g font-family="system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#164d5f">
<text x="165" y="250">10 A</text><text x="315" y="250">16 A</text><text x="455" y="250">25 A</text><text x="600" y="250">20 A</text><text x="740" y="250">25 A</text>
</g>
<g font-family="system-ui,sans-serif" font-size="12" text-anchor="middle" fill="#46616a">
<text x="165" y="290" font-weight="700" fill="#17262d">C1 Alumbrado</text><text x="165" y="308">1,5 mm²</text>
<text x="315" y="290" font-weight="700" fill="#17262d">C2 Tomas</text><text x="315" y="308">2,5 mm²</text>
<text x="455" y="290" font-weight="700" fill="#17262d">C3 Cocina</text><text x="455" y="308">6 mm²</text>
<text x="600" y="290" font-weight="700" fill="#17262d">C4 Lavadora</text><text x="600" y="308">4 mm²</text>
<text x="740" y="290" font-weight="700" fill="#17262d">C5 Climatización</text><text x="740" y="308">6 mm²</text>
</g>
<g stroke="#245c49" stroke-width="3"><path d="M60 206 V250"/><path d="M44 250 H76"/><path d="M50 258 H70"/><path d="M56 266 H64"/></g>
<text x="60" y="290" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#245c49">tierra</text>

<g font-family="system-ui,sans-serif" font-size="12.5" fill="#46616a">
<text x="30" y="348"><tspan font-weight="700" fill="#8f3a24">El IGA</tspan> protege la instalación de una sobrecarga global y permite cortar todo.</text>
<text x="30" y="368"><tspan font-weight="700" fill="#705015">El diferencial</tspan> protege a las personas: corta si la corriente que entra y la que sale no coinciden.</text>
<text x="30" y="388"><tspan font-weight="700" fill="#164d5f">Cada magnetotérmico</tspan> protege el cable de su circuito, y por eso su intensidad depende de la sección.</text>
</g>
</svg>
