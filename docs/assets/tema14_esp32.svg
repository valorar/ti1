<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t14_title t14_desc">
<title id="t14_title">Pines del ESP32 que se usan en el curso</title>
<desc id="t14_desc">Esquema de los pines útiles de una placa ESP32. A la izquierda, la alimentación de 3,3 voltios y masa, los pines GPIO 36, 39, 34 y 35 que pertenecen al convertidor ADC1 y son solo de entrada, y los GPIO 32 y 33 que también son de ADC1 y pueden ser entrada o salida. A la derecha, la entrada de 5 voltios, otra masa y los pines GPIO 23, 22, 21, 19, 18 y 5 utilizables como salida digital y como salida de modulación de ancho de pulso, más los GPIO 25 y 26 que pertenecen a ADC2 y por tanto solo deben usarse como salida.</desc>
<rect width="900" height="500" rx="24" fill="#f7faf8"/>
<text x="20" y="32" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#18384a">ESP32: qué pin usar para qué</text>

<rect x="340" y="70" width="220" height="330" rx="10" fill="#eef2f4" stroke="#46616a" stroke-width="3"/>
<rect x="418" y="52" width="64" height="26" rx="4" fill="#58707a"/>
<text x="450" y="70" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#fff">USB-C</text>
<text x="450" y="240" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#46616a">ESP32 DevKit</text>

<g stroke="#46616a" stroke-width="3">
