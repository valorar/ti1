<path d="M560 100 H582"/><path d="M560 136 H582"/><path d="M560 172 H582"/><path d="M560 208 H582"/><path d="M560 244 H582"/><path d="M560 280 H582"/><path d="M560 316 H582"/><path d="M560 352 H582"/><path d="M560 388 H582"/>
</g>
