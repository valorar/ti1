<circle cx="312" cy="172" r="7" fill="#8aa0a8"/><circle cx="312" cy="208" r="7" fill="#8aa0a8"/><circle cx="312" cy="244" r="7" fill="#8aa0a8"/><circle cx="312" cy="280" r="7" fill="#8aa0a8"/>
<circle cx="312" cy="316" r="7" fill="#2b8c7f"/><circle cx="312" cy="352" r="7" fill="#2b8c7f"/><circle cx="312" cy="388" r="7" fill="#c6922d"/>
<circle cx="588" cy="100" r="7" fill="#c85c40"/><circle cx="588" cy="136" r="7" fill="#c85c40"/>
<circle cx="588" cy="172" r="7" fill="#c6922d"/><circle cx="588" cy="208" r="7" fill="#c6922d"/><circle cx="588" cy="244" r="7" fill="#c6922d"/><circle cx="588" cy="280" r="7" fill="#c6922d"/><circle cx="588" cy="316" r="7" fill="#c6922d"/><circle cx="588" cy="352" r="7" fill="#c6922d"/><circle cx="588" cy="388" r="7" fill="#c6922d"/>
</g>
<g font-family="system-ui,sans-serif" font-size="13" text-anchor="end">
<text x="298" y="105" font-weight="700" fill="#8f3a24">3,3 V</text>
<text x="298" y="141" font-weight="700" fill="#8f3a24">GND</text>
<text x="298" y="177" fill="#46616a">GPIO 36 · ADC1 · solo entrada</text>
<text x="298" y="213" fill="#46616a">GPIO 39 · ADC1 · solo entrada</text>
<text x="298" y="249" font-weight="700" fill="#0f4f4a">GPIO 34 · ADC1 · solo entrada</text>
<text x="298" y="285" fill="#46616a">GPIO 35 · ADC1 · solo entrada</text>
<text x="298" y="321" font-weight="700" fill="#0f4f4a">GPIO 32 · ADC1 · entrada o salida</text>
<text x="298" y="357" font-weight="700" fill="#0f4f4a">GPIO 33 · ADC1 · entrada o salida</text>
<text x="298" y="393" fill="#8a6317">GPIO 25 · ADC2 · usar solo como salida</text>
</g>
<g font-family="system-ui,sans-serif" font-size="13">
<text x="602" y="105" font-weight="700" fill="#8f3a24">5 V (VIN)</text>
<text x="602" y="141" font-weight="700" fill="#8f3a24">GND</text>
<text x="602" y="177" fill="#8a6317">GPIO 23 · salida y PWM</text>
<text x="602" y="213" fill="#8a6317">GPIO 22 · salida y PWM</text>
<text x="602" y="249" fill="#8a6317">GPIO 21 · salida y PWM</text>
<text x="602" y="285" fill="#8a6317">GPIO 19 · salida y PWM</text>
<text x="602" y="321" fill="#8a6317">GPIO 18 · salida y PWM</text>
<text x="602" y="357" fill="#8a6317">GPIO 5 · salida y PWM</text>
<text x="602" y="393" font-weight="700" fill="#8a6317">GPIO 26 · ADC2 · usar solo como salida</text>
</g>

<g font-family="system-ui,sans-serif" font-size="12.5">
<circle cx="48" cy="440" r="7" fill="#2b8c7f"/><text x="66" y="445" fill="#46616a">ADC1: lectura analógica fiable también con el Wi-Fi activo</text>
<circle cx="490" cy="440" r="7" fill="#8aa0a8"/><text x="508" y="445" fill="#46616a">solo entrada: no puede usarse como salida</text>
<circle cx="48" cy="468" r="7" fill="#c6922d"/><text x="66" y="473" fill="#46616a">salida digital y PWM</text>
<circle cx="490" cy="468" r="7" fill="#c85c40"/><text x="508" y="473" fill="#46616a">alimentación: nunca más de 3,3 V en un pin de datos</text>
</g>
</svg>
